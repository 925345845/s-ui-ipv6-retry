name: Relay regression checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        run: npm ci --prefix frontend && npm run build --prefix frontend
      - name: Test IPv6 allocation and relay configuration
        run: |
          go test -race ./internal/relayipv6 -count=1
          CGO_ENABLED=1 go test ./service -run Relay -count=1
      - name: Validate installers
        run: |
          for file in install.sh s-ui.sh install-agent.sh paired-release/install-s-ui-paired-online.sh paired-release/install-s-ui-paired.sh; do bash -n "$file"; done
          bash scripts/test-install-safety.sh
