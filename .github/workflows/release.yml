name: Build independent Linux release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and test
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9][A-Za-z0-9._-]*$ ]]
          npm ci --prefix frontend
          npm run build --prefix frontend
          mkdir -p web/html s-ui
          cp -a frontend/dist/. web/html/
          go test -race ./internal/relayipv6 -count=1
          CGO_ENABLED=1 go test ./service -run Relay -count=1
          sudo apt-get update
          sudo apt-get install -y musl-tools
          CGO_ENABLED=1 CC=musl-gcc go build -trimpath \
            -tags 'with_quic,with_grpc,with_utls,with_acme,with_gvisor,badlinkname,tfogo_checklinkname0,with_tailscale' \
            -ldflags "-w -s -checklinkname=0 -linkmode external -extldflags -static -X github.com/Hhz0823/1s-ui/config.version=${RELEASE_TAG#v}" \
            -o s-ui/sui main.go
          CGO_ENABLED=0 go build -trimpath -ldflags '-w -s' -o s-ui/sui-agent ./cmd/sui-agent
          cp s-ui.sh s-ui.service s-ui-agent.service install-agent.sh s-ui/
          chmod 755 s-ui/sui s-ui/sui-agent s-ui/*.sh
          tar -czf s-ui-linux-${{ matrix.arch }}.tar.gz s-ui
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: s-ui-linux-*.tar.gz

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: assets
          merge-multiple: true
      - name: Prepare checksums and draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cp paired-release/install-s-ui-paired.sh assets/
          cd assets
          sha256sum s-ui-linux-*.tar.gz install-s-ui-paired.sh > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "S-UI IPv6 Retry $RELEASE_TAG" --generate-notes ./*
